workflows:
  backend-workflow:
    name: Backend Verification
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Install backend dependencies
        script: cd backend && npx --yes npm@11.14.1 ci
      - name: Typecheck backend
        script: cd backend && npm run typecheck
      - name: Lint backend
        script: cd backend && npm run lint
      - name: Test backend authentication
        script: cd backend && npm test

  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter test
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter test
        script: flutter test
      - name: Build iOS unsigned
        script: flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  macos-workflow:
    name: macOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter test
        script: flutter test
      - name: Build macOS
        script: flutter build macos --debug
    artifacts:
      - build/macos/Build/Products/Debug/*.app

  windows-workflow:
    name: Windows Build
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter test
        script: flutter test
      - name: Build Windows
        script: flutter build windows --debug
    artifacts:
      - build/windows/runner/Debug/*.exe

  android-release:
    name: Signed Android Release (manual)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - production_android
    scripts:
      - name: Validate release configuration
        script: |
          set -eu
          case "$API_BASE_URL" in https://*) ;; *) echo "HTTPS API_BASE_URL is required"; exit 1;; esac
          : "${ANDROID_APPLICATION_ID:?Required}"
          : "${ANDROID_KEYSTORE_PATH:?Provision the keystore as a secure file}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Required}"
          : "${ANDROID_KEY_ALIAS:?Required}"
          : "${ANDROID_KEY_PASSWORD:?Required}"
      - name: Verify Flutter
        script: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build signed release
        script: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
