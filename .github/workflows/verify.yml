name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npx --yes npm@11.14.1 ci
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate
      - run: npm run db:check
      - run: npm run test:coverage
      - run: npm run build
      - run: python3 -m unittest discover -s scripts -p "*_test.py"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true
      - run: bash .github/scripts/verify-command.sh flutter pub get --enforce-lockfile
      - run: bash .github/scripts/verify-command.sh flutter analyze
      - run: bash .github/scripts/verify-command.sh flutter test --coverage
      # Compilation check only. This is not a deployable production artifact.
      - run: bash .github/scripts/verify-command.sh flutter build web --release --dart-define=API_BASE_URL=https://api.example.invalid

  android-release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_APPLICATION_ID: org.example.ci.seshadripuram
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-only.jks
      ANDROID_KEYSTORE_PASSWORD: ci-only-not-production
      ANDROID_KEY_ALIAS: ci-only
      ANDROID_KEY_PASSWORD: ci-only-not-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true
      - name: Generate disposable CI signing key (never distribute this build)
        run: |
          keytool -genkeypair -noprompt -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI compilation check"
      - run: bash .github/scripts/verify-command.sh flutter pub get --enforce-lockfile
      - run: bash .github/scripts/verify-command.sh flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid
      - name: Remove disposable signing material and APK
        if: always()
        run: |
          rm -f "$ANDROID_KEYSTORE_PATH"
          rm -rf build/app/outputs/flutter-apk
